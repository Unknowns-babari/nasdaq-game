<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나스닥 모의투자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* VOICE: 증권 앱처럼 조용하고 단정하게 — 숫자만 크게
   IDEA: 모바일 증권 앱의 카드 화면 (계좌 → 종목 → 상세 → 주문 바텀시트)
   PICTURE: 선택 종목의 큰 가격과 면적 라인 차트
   COLOUR and TYPE: 연회색 바탕 위 흰 카드, 상승 빨강·하락/버튼 파랑, Pretendard
   LAYOUT: 왼쪽 계좌·종목 목록, 오른쪽 종목 상세; 좁은 화면은 한 줄로 */
:root{color-scheme:light dark;
--bg:light-dark(#f2f4f6,#101013);--card:light-dark(#fff,#1c1c21);--ink:light-dark(#191f28,#f2f4f6);--sub:light-dark(#8b95a1,#8b8f99);
--line:light-dark(#eef0f3,#2a2a31);--soft:light-dark(#f2f4f6,#26262d);--blue:#3182f6;--blueh:#1b64da;--up:#f04452;--dn:#3182f6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--sub)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;border-radius:12px;letter-spacing:inherit}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--blue);color:#fff;font-weight:600;padding:0 18px}.pri:hover{background:var(--blueh)}
.ghost{background:var(--soft);font-weight:600;padding:0 14px}
/* 상단바 */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);padding:10px max(3vw,16px);padding-top:max(10px,env(safe-area-inset-top))}
.topin{max-width:1120px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;margin-right:auto;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--up)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 1.4s infinite}
.live.off{color:var(--sub)}.live.off i{background:var(--sub);animation:none}
@keyframes pulse{50%{opacity:.3}}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{min-height:36px;padding:0 12px;font-size:14px;font-weight:600;color:var(--sub);border-radius:9px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.me{font-size:14px;font-weight:600}
.small{min-height:36px;font-size:14px;padding:0 12px}
/* 레이아웃 */
main{max-width:1120px;margin:auto;padding:6px max(3vw,16px) 40px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px}
.card{background:var(--card);border-radius:22px;padding:22px}
h2{font-size:19px;font-weight:700;margin:0 0 14px}
h3{font-size:15px;font-weight:600;margin:0}
/* 계좌 */
.acc .label{font-size:15px;color:var(--sub);font-weight:500}
.acc .total{font-size:clamp(30px,4vw,36px);font-weight:800;margin:4px 0 2px;letter-spacing:-.03em}
.acc .pl{font-size:15px;font-weight:600}
.acc .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.acc .box{background:var(--soft);border-radius:14px;padding:12px 14px}
.acc .box b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.acc .box span{font-size:13px;color:var(--sub)}
/* 종목 목록 */
.tabs{display:flex;gap:18px;margin-bottom:6px}
.tabs button{min-height:36px;padding:0;font-size:17px;font-weight:700;color:var(--sub);border-radius:0}
.tabs button.on{color:var(--ink)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 8px;margin:0 -8px;border-radius:14px;cursor:pointer;width:calc(100% + 16px);text-align:left}
.row:hover{background:var(--soft)}.row.on{background:var(--soft)}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
.row .nm{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sb{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{text-align:right}.row .pr{font-weight:600;font-size:16px}.row .ch{font-size:13px;font-weight:600}
.empty{color:var(--sub);font-size:15px;padding:18px 0;text-align:center}
.flash{animation:fl .5s}@keyframes fl{from{background:color-mix(in srgb,var(--blue) 12%,transparent)}}
/* 상세 */
.dhead{display:flex;align-items:center;gap:12px}
.dhead .logo{width:44px;height:44px}
.dname{font-size:17px;font-weight:700}.dsub{font-size:13px;color:var(--sub)}
.dprice{font-size:clamp(32px,4.4vw,40px);font-weight:800;letter-spacing:-.03em;margin:16px 0 0}
.dchg{font-size:15px;font-weight:600}
.real{display:inline-block;font-size:12px;font-weight:600;color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent);padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:2px}
.fig{position:relative;height:clamp(240px,34vh,340px);margin:14px -6px 6px}.fig>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.pos div{background:var(--soft);border-radius:14px;padding:12px 14px}
.pos span{display:block;font-size:13px;color:var(--sub)}.pos b{font-size:16px;font-weight:700}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.act button{min-height:56px;font-size:17px;font-weight:700;border-radius:16px;color:#fff}
.sell{background:var(--dn)}.buy{background:var(--up)}
.sell:hover{filter:brightness(.93)}.buy:hover{filter:brightness(.93)}
/* 뉴스·내역 */
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.feed li:first-child{border-top:0}
.feed small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.f{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}.tag.r{background:var(--soft);color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{font-size:13px;color:var(--sub);margin:14px 2px 0;line-height:1.6}
.sync{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync .msg{flex:1 1 100%;font-size:14px;color:var(--sub)}
/* 바텀시트 */
.dim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 22px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@media(min-width:700px){.dim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{font-size:21px;margin:0 0 4px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.qty button{width:48px;height:48px;border-radius:50%;background:var(--soft);font-size:24px;font-weight:600;flex:none}
.qty input{font-weight:800;font-size:34px;line-height:1;font-family:inherit;text-align:center;border:0;background:none;color:var(--ink);width:100%;letter-spacing:-.03em}
.qty input::-webkit-inner-spin-button{appearance:none}
.chips{display:flex;gap:6px}
.chips button{flex:1;min-height:40px;background:var(--soft);font-size:14px;font-weight:600}
.sum{margin:18px 0;display:grid;gap:8px;font-size:15px}
.sum div{display:flex;justify-content:space-between}.sum .mute{font-weight:500}
.sum .big{font-size:17px;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.confirm{width:100%;min-height:56px;font-size:17px;font-weight:700;color:#fff;border-radius:16px}
/* 로그인 */
.gate{position:fixed;inset:0;z-index:40;background:var(--card);display:none;overflow:auto}
.gate.show{display:block}
.gin{max-width:420px;margin:auto;min-height:100%;display:flex;flex-direction:column;padding:max(48px,8vh) 24px calc(24px + env(safe-area-inset-bottom))}
.gin h1{font-size:clamp(26px,6vw,30px);font-weight:800;line-height:1.3;margin:0 0 32px;letter-spacing:-.03em}
.fld{margin-bottom:22px}
.fld label{display:block;font-size:14px;color:var(--sub);font-weight:500;margin-bottom:4px}
.fld input{width:100%;font-weight:600;font-size:20px;line-height:1.2;font-family:inherit;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);padding:8px 0;border-radius:0;outline:0}
.fld input:focus{border-bottom-color:var(--blue)}
.keep{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer;min-height:44px;user-select:none}
.keep input{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0;cursor:pointer;flex:none}
.keep input:checked{background:var(--blue)}
.keep input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.keep small{color:var(--sub);font-size:13px;font-weight:400}
.gerr{color:var(--up);font-size:14px;min-height:22px;margin:6px 0}
.gbot{margin-top:auto;padding-top:24px;display:grid;gap:8px}
.gbot .pri{min-height:56px;font-size:17px;border-radius:16px}
.switch{color:var(--sub);font-size:15px;text-align:center}
.switch button{color:var(--blue);font-weight:600;min-height:40px;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:#333d4b;color:#fff;padding:12px 20px;border-radius:14px;font-size:15px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.live i{animation:none}.sheet{animation:none}.flash{animation:none}}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}#detail{order:-1}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){.card{padding:18px;border-radius:20px}.top .seg button{padding:0 9px}.pos b{font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">나스닥 모의투자 <span class="live" id="live"><i></i><span id="liveTx">실시간</span></span></div>
  <div class="seg" role="group" aria-label="속도"><button data-s="1" class="on">1x</button><button data-s="4">4x</button><button data-s="15">15x</button><button id="pause">일시정지</button></div>
  <span class="me" id="me"></span><button class="ghost small" id="logout" hidden>로그아웃</button>
</div></header>

<main>
  <div class="col">
    <section class="card acc">
      <div class="label">내 투자 · 총자산</div>
      <div class="total num" id="total">$0</div>
      <div class="pl num" id="pl"></div>
      <div class="grid">
        <div class="box"><span>주문 가능 금액</span><b class="num" id="cash"></b></div>
        <div class="box"><span>투자 중인 금액</span><b class="num" id="inv"></b></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="ghost small" id="reset">처음부터 다시</button></div>
    </section>
    <section class="card">
      <div class="tabs" role="tablist"><button id="tAll" class="on" role="tab">전체 종목</button><button id="tMine" role="tab">내 주식</button></div>
      <div id="list"></div>
    </section>
    <section class="card" id="syncCard" hidden>
      <h3 style="margin-bottom:10px">실제 시세 받기</h3>
      <div class="sync"><span class="msg" id="syncMsg"></span><button class="ghost small" id="syncAll" disabled>전체 종목</button><button class="ghost small" id="syncOne" disabled>보고 있는 종목</button><span class="msg" id="quota" style="font-size:13px"></span></div>
    </section>
  </div>

  <div class="col">
    <section class="card" id="detail">
      <div class="dhead"><div class="logo" id="dLogo"></div><div><div class="dname" id="dName"></div><div class="dsub" id="dSub"></div></div></div>
      <div class="dprice num" id="dPrice"></div>
      <div class="dchg num" id="dChg"></div>
      <div class="fig"><canvas id="cv" aria-label="가격 차트"></canvas></div>
      <div class="ctl"><span class="mute" style="font-size:13px" id="cInfo">1칸 = 15초</span>
        <div class="seg"><button data-c="line" class="on">라인</button><button data-c="candle">캔들</button></div></div>
      <div class="pos" id="pos"></div>
      <div class="act"><button class="sell" id="openSell">판매하기</button><button class="buy" id="openBuy">구매하기</button></div>
    </section>
    <div class="two">
      <section class="card"><h2>실시간 뉴스</h2><ul class="feed" id="news"></ul>
        <p class="note"><span class="tag f">속보</span>대체로 맞아요 <span class="tag r">루머</span>반반이에요. 틀리면 반대로 움직여요. 뉴스는 모두 게임용 가상 뉴스예요.</p></section>
      <section class="card"><h2>거래 내역</h2><ul class="feed" id="log"></ul></section>
    </div>
    <p class="note">시작가는 2026년 11월 26일에 조회한 실제 시세예요. 이후 움직임은 게임용 시뮬레이션이라 실제 시장과 달라요. 수수료 0.1%. 투자 조언이 아닌 게임이에요.</p>
  </div>
</main>

<div class="dim" id="dim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <h2 id="shTitle"></h2><div class="mute num" id="shPrice"></div>
  <div class="qty"><button id="minus" aria-label="1주 빼기">−</button><input id="q" type="number" min="1" step="1" inputmode="numeric" aria-label="수량"><button id="plus" aria-label="1주 더하기">+</button></div>
  <div class="mute" style="text-align:center;font-size:14px;margin-bottom:14px" id="shMax"></div>
  <div class="chips"><button data-p=".1">10%</button><button data-p=".25">25%</button><button data-p=".5">50%</button><button data-p="1">최대</button></div>
  <div class="sum" id="shSum"></div>
  <button class="confirm" id="shGo"></button>
  <button class="ghost" style="width:100%;margin-top:8px;background:none;color:var(--sub)" id="shClose">닫기</button>
</div></div>

<div class="gate" id="gate"><form class="gin" id="gform" autocomplete="on">
  <h1 id="gTitle">아이디와 비밀번호를<br>입력해주세요</h1>
  <div class="fld"><label for="uid">아이디</label><input id="uid" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문 소문자·숫자 3~20자"></div>
  <div class="fld"><label for="pw">비밀번호</label><input id="pw" name="password" type="password" autocomplete="current-password" placeholder="6자 이상"></div>
  <div class="fld" id="pw2wrap" hidden><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password"></div>
  <label class="keep"><input type="checkbox" id="keep" checked> <span>로그인 유지하기<br><small>이 브라우저를 닫았다 열어도 자동으로 로그인돼요</small></span></label>
  <div class="gerr" id="gerr" role="alert"></div>
  <div class="gbot">
    <button class="pri" id="gogo" type="submit">로그인</button>
    <div class="switch"><span id="swTx">처음이신가요?</span> <button type="button" id="swBtn">회원가입</button></div>
    <button type="button" class="ghost" id="guest" style="background:none;color:var(--sub)">로그인 없이 둘러보기</button>
  </div>
</form></div>
<div class="toast" id="toast"></div>
<span id="probe" hidden></span>

<script>
{
const START=100000,FEE=.001,KEY='nasdaqlive1',PER=15;
const DEF=[
 ['AAPL','애플','IT 기기',356.27,.016,1,'#555'],['NVDA','엔비디아','반도체',162.85,.03,1.5,'#76b900'],['MSFT','마이크로소프트','소프트웨어',523.88,.015,1,'#00a4ef'],
 ['AMZN','아마존','이커머스·클라우드',266.66,.02,1.2,'#ff9900'],['GOOGL','알파벳','인터넷',295.77,.019,1.1,'#4285f4'],['META','메타','인터넷',641.69,.024,1.3,'#0866ff'],
 ['TSLA','테슬라','전기차',390.22,.04,1.8,'#cc0000'],['AVGO','브로드컴','반도체',347.01,.03,1.4,'#c8102e'],['AMD','AMD','반도체',534.06,.035,1.6,'#222'],
 ['MU','마이크론','반도체',778.31,.035,1.6,'#0b5cab'],['PLTR','팔란티어','소프트웨어',167.99,.04,1.8,'#101820'],['COST','코스트코','유통',1106.21,.012,.6,'#005daa']];
const POS=['{n} 목표주가 상향 리포트','{n} 신제품 반응 기대 이상','{n} 대형 고객사 계약 소식','{s} 업종 수요 증가 전망','{n} 실적 기대감에 매수세 유입'];
const NEG=['{n} 목표주가 하향 리포트','{n} 공급망 차질 우려','{s} 업종 규제 강화 검토','{n} 대량 매도 물량 출회','{s} 업종 수요 둔화 전망'];
const MKT=[['연준 금리 인하 기대감 확산',1],['기술주로 자금 유입 전망',1],['국채 금리 급등, 기술주 부담',-1],['경기 둔화 우려 보고서',-1]];
const $=id=>document.getElementById(id);
const usd=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=n=>(n>0?'+':'')+usd(n);
const ip=n=>Math.round(n).toLocaleString('ko-KR');
const pct=x=>(x>0?'+':'')+(x*100).toFixed(2)+'%';
const cls=x=>x>0?'up':x<0?'dn':'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const r2=p=>Math.max(.01,Math.round(p*100)/100);
const color=i=>DEF[i][6];
let G,timer=null,speed=1,paused=false,tab='all',chartType='line',hoverX=null,sheet=null;

// ---- 시장 엔진 ----
function tickOnce(){
  G.tick++;
  if(Math.random()<.01)G.regime=(Math.random()-.5)*.0003;
  const zm=norm()*.0007+G.regime;
  G.stocks.forEach((s,i)=>{
    let eff=0;
    for(const e of G.pending){if(G.tick>=e.from&&G.tick<e.to&&(e.all||e.id===i||e.sec===s.sec))eff+=(e.all||e.id===i?e.v:e.v*.6)/(e.to-e.from)}
    s.p=r2(s.p*Math.exp(s.beta*zm+s.vol*.065*norm()+eff));
    const c=s.cur;c.h=Math.max(c.h,s.p);c.l=Math.min(c.l,s.p);c.c=s.p;c.n++;
    if(c.n>=PER){s.c.push({o:c.o,h:c.h,l:c.l,c:c.c});if(s.c.length>150)s.c.shift();s.cur={o:s.p,h:s.p,l:s.p,c:s.p,n:0}}
  });
  G.pending=G.pending.filter(e=>e.to>G.tick);
  if(G.tick%PER===0){G.worth.push(worth());if(G.worth.length>300)G.worth.shift()}
  if(G.tick>=G.nextNews){makeNews();G.nextNews=G.tick+25+Math.floor(Math.random()*40)}
}
function makeNews(){
  const rumor=Math.random()<.4,p=rumor?.5:.88;let e;
  if(Math.random()<.2){const m=MKT[Math.floor(Math.random()*MKT.length)];e={all:1,v:m[1]*(.005+Math.random()*.01),t:m[0]}}
  else{const i=Math.floor(Math.random()*G.stocks.length),s=G.stocks[i],good=Math.random()<.52;
    const tpl=(good?POS:NEG)[Math.floor(Math.random()*5)],wide=tpl.includes('{s}');
    e={id:wide?-1:i,sec:wide?s.sec:null,v:(good?1:-1)*(.015+Math.random()*.045),t:tpl.replace('{n}',s.name).replace('{s}',s.sec)}}
  if(Math.random()>p)e.v=-e.v*.4;
  e.from=G.tick+6;e.to=e.from+PER;G.pending.push(e);
  G.news.unshift({t:e.t,r:rumor,at:G.tick});if(G.news.length>40)G.news.length=40;
}
function worth(){return G.cash+Object.entries(G.hold).reduce((a,[i,h])=>a+h.q*G.stocks[i].p,0)}
function newGame(){
  G={tick:0,cash:START,hold:{},news:[],log:[],pending:[],regime:0,sel:1,nextNews:12,worth:[START],
     stocks:DEF.map(d=>({t:d[0],name:d[1],sec:d[2],ref:d[3],vol:d[4],beta:d[5],p:d[3],c:[],cur:null}))};
  G.stocks.forEach(s=>{let p=100;const arr=[];
    for(let k=0;k<60;k++){const o=p;let h=o,l=o;for(let j=0;j<PER;j++){p*=Math.exp(s.vol*.065*norm());h=Math.max(h,p);l=Math.min(l,p)}arr.push({o,h,l,c:p})}
    const f=s.ref/p;s.c=arr.map(b=>({o:r2(b.o*f),h:r2(b.h*f),l:r2(b.l*f),c:r2(b.c*f)}));s.p=s.ref;s.cur={o:s.p,h:s.p,l:s.p,c:s.p,n:0}});
  save();listSig='';render();
}
let UKEY=KEY,cloudDirty=false;
function save(){cloudDirty=true;try{localStorage.setItem(UKEY,JSON.stringify(G))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(UKEY));if(s&&s.stocks&&s.stocks.length===DEF.length){G=s;return true}}catch(e){}return false}
function loop(){for(let k=0;k<speed;k++)tickOnce();if(G.tick%5<speed)save();render()}
function start(){clearInterval(timer);timer=setInterval(loop,1000);paused=false;$('pause').textContent='일시정지';$('pause').classList.remove('on');$('live').classList.remove('off');$('liveTx').textContent='실시간'}

function trade(buy,q){
  const i=G.sel,s=G.stocks[i],p=s.p;
  if(!(q>0)){toast('수량을 1주 이상 입력해주세요');return false}
  const amt=p*q,fee=amt*FEE;
  if(buy){
    if(amt+fee>G.cash){toast('주문 가능 금액이 부족해요 (최대 '+ip(maxBuy())+'주)');return false}
    const h=G.hold[i]||{q:0,a:0};h.a=(h.a*h.q+amt)/(h.q+q);h.q+=q;G.hold[i]=h;G.cash-=amt+fee;
    G.log.unshift({t:`${s.name} ${ip(q)}주 구매`,d:`${usd(p)} · 총 ${usd(amt+fee)}`,c:'up'});toast(`${s.name} ${ip(q)}주를 샀어요`);
  }else{
    const h=G.hold[i];if(!h||h.q<q){toast('가진 주식이 부족해요 (보유 '+ip(h?h.q:0)+'주)');return false}
    const pl=amt-fee-h.a*q;G.cash+=amt-fee;h.q-=q;if(!h.q)delete G.hold[i];
    G.log.unshift({t:`${s.name} ${ip(q)}주 판매`,d:`${usd(p)} · 실현손익 ${sgn(pl)}`,c:'dn'});toast(`${s.name} ${ip(q)}주를 팔았어요`);
  }
  if(G.log.length>50)G.log.length=50;save();listSig='';render();pushCloud();return true;
}

    :[['판매 금액',usd(amt)],['수수료',usd(fee)],['예상 손익',h?sgn(amt-fee-h.a*q):'-',0,h?cls(amt-fee-h.a*q):''],['받을 금액',usd(amt-fee),1]];

function col(v){const p=$('probe');p.style.color=`var(${v})`;p.hidden=false;const c=getComputedStyle(p).color;p.hidden=true;return c}
const cv=$('cv');
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const s=G.stocks[G.sel],N=W<520?40:70,d=s.c.concat([s.cur]).slice(-N),PR=6,PT=24,PB=20;
  let mn=Math.min(...d.map(b=>chartType==='line'?b.c:b.l)),mx=Math.max(...d.map(b=>chartType==='line'?b.c:b.h));const h=G.hold[G.sel];
  if(h&&h.a<mx*1.15&&h.a>mn*.85){mn=Math.min(mn,h.a);mx=Math.max(mx,h.a)}
  const pad=(mx-mn)*.08||mx*.005;mn-=pad;mx+=pad;
  const cw=(W-PR)/N,X=i=>i*cw+cw/2+(N-d.length)*cw,Y=v=>PT+(mx-v)/(mx-mn)*(H-PT-PB);
  const sub=col('--sub'),line=col('--line'),up=col('--up'),dn=col('--dn'),ink=col('--ink');
  const rising=s.p>=d[0].c,lc=rising?up:dn;
  x.font='600 12px "Pretendard Variable",sans-serif';
  const ry=Y(s.ref);if(ry>PT&&ry<H-PB){x.strokeStyle=line;x.lineWidth=1;x.setLineDash([3,4]);x.beginPath();x.moveTo(0,ry);x.lineTo(W,ry);x.stroke();x.setLineDash([])}
  if(chartType==='line'){
    const g=x.createLinearGradient(0,PT,0,H-PB);g.addColorStop(0,lc.replace('rgb','rgba').replace(')',',.18)'));g.addColorStop(1,lc.replace('rgb','rgba').replace(')',',0)'));
    x.beginPath();d.forEach((b,i)=>i?x.lineTo(X(i),Y(b.c)):x.moveTo(X(i),Y(b.c)));
    x.lineTo(X(d.length-1),H-PB);x.lineTo(X(0),H-PB);x.closePath();x.fillStyle=g;x.fill();
    x.beginPath();d.forEach((b,i)=>i?x.lineTo(X(i),Y(b.c)):x.moveTo(X(i),Y(b.c)));x.strokeStyle=lc;x.lineWidth=2.2;x.lineJoin='round';x.stroke();
    const lx=X(d.length-1),ly=Y(s.p);x.fillStyle=lc;x.beginPath();x.arc(lx,ly,4,0,7);x.fill();
  }else{
    d.forEach((b,i)=>{const c=b.c>=b.o?up:dn;x.strokeStyle=c;x.fillStyle=c;x.lineWidth=1;x.beginPath();x.moveTo(X(i),Y(b.h));x.lineTo(X(i),Y(b.l));x.stroke();
      const t=Math.min(Y(b.o),Y(b.c)),bh=Math.max(1,Math.abs(Y(b.o)-Y(b.c)));x.beginPath();x.roundRect?x.roundRect(X(i)-cw*.33,t,cw*.66,bh,1.5):x.rect(X(i)-cw*.33,t,cw*.66,bh);x.fill()});
  }
  // 최고·최저 표시
  const hi=d.reduce((a,b,i)=>b.c>d[a].c?i:a,0),lo=d.reduce((a,b,i)=>b.c<d[a].c?i:a,0);
  x.fillStyle=sub;x.textBaseline='bottom';const lab=(i,t,yy)=>{const w=x.measureText(t).width;let xx=Math.min(W-w-2,Math.max(2,X(i)-w/2));x.fillText(t,xx,yy)};
  lab(hi,'최고 '+usd(d[hi].c),Math.max(14,Y(d[hi].c)-6));x.textBaseline='top';lab(lo,'최저 '+usd(d[lo].c),Math.min(H-14,Y(d[lo].c)+6));
  if(h){const yy=Y(h.a);if(yy>PT&&yy<H-PB){x.strokeStyle=ink;x.globalAlpha=.35;x.setLineDash([5,4]);x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();x.setLineDash([]);x.globalAlpha=1;x.fillStyle=sub;x.textBaseline='bottom';x.fillText('내 평균 '+usd(h.a),4,yy-3)}}
  if(hoverX!=null){const i=Math.max(0,Math.min(d.length-1,Math.round((hoverX-cw/2)/cw-(N-d.length))));const b=d[i],hx=X(i),hy=Y(b.c);
    x.strokeStyle=sub;x.lineWidth=1;x.beginPath();x.moveTo(hx,PT-8);x.lineTo(hx,H-PB);x.stroke();x.fillStyle=lc;x.beginPath();x.arc(hx,hy,4,0,7);x.fill();
    const ago=(d.length-1-i)*15*1,tx=`${usd(b.c)} · ${ago?(ago>=60?Math.floor(ago/60)+'분 ':'')+(ago%60?ago%60+'초 ':'')+'전':'지금'}`;
    x.font='700 13px "Pretendard Variable",sans-serif';const tw=x.measureText(tx).width;x.fillStyle=ink;x.textBaseline='top';x.fillText(tx,Math.min(W-tw-4,Math.max(4,hx-tw/2)),0)}
}

const SRV='Alpha Vantage MCP Server',TOOL='GLOBAL_QUOTE',QK='nasdaqlive1-quota',LIMIT=25;
let mcp=null,busy=false;
const today=()=>new Date().toISOString().slice(0,10);
function used(){try{const q=JSON.parse(localStorage.getItem(QK));return q&&q.d===today()?q.n:0}catch(e){return 0}}
function use1(){try{localStorage.setItem(QK,JSON.stringify({d:today(),n:used()+1}))}catch(e){}}

function errText(e){return({server_not_connected:'Alpha Vantage 커넥터를 연결해 주세요 (claude.ai 설정 → 커넥터).',needs_reauth:'Alpha Vantage를 다시 연결해 주세요 (claude.ai 설정 → 커넥터).',
  not_in_manifest:'이 페이지에서 Alpha Vantage 사용이 허용되지 않았어요.',approval_required:'승인이 필요해요. 버튼을 다시 눌러 승인해 주세요.',blocked_by_policy:'조직 정책으로 쓸 수 없어요.',
  server_unavailable:'Alpha Vantage가 잠시 응답하지 않아요.'})[e&&e.code]||('시세를 받지 못했어요 ('+String(e&&e.code||'오류')+')')}
async function fetchQuote(sym,retried){
  let res;try{res=await mcp.callTool(SRV,TOOL,{symbol:sym,datatype:'json'},{cache:false})}
  catch(e){if(e&&e.retryable&&!retried){await wait((e.retryAfterMs||1500)+Math.random()*800);return fetchQuote(sym,true)}throw e}
  use1();let p=res.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
  if(p&&typeof p==='object'&&(p.error||p.Information||p.Note))return {limit:true};
  const q=p&&p['Global Quote'];if(!q||!q['05. price'])return {none:true};
  const price=parseFloat(q['05. price']),prev=parseFloat(q['08. previous close']);if(!(price>0))return {none:true};
  return {price,prev:prev>0?prev:price,day:String(q['07. latest trading day']||'').slice(5,10)};
}
async function sync(list){
  if(!mcp||busy)return;busy=true;setBtns(true);let ok=0;
  for(let k=0;k<list.length;k++){const i=list[k];msg(`${G.stocks[i].name} 받는 중 (${k+1}/${list.length})`);
    try{const q=await fetchQuote(G.stocks[i].t);
      if(q.limit){msg(`무료 조회 한도에 걸렸어요. ${ok}개만 반영했어요.`);break}
      if(!q.none){const s=G.stocks[i];s.p=r2(q.price);s.ref=r2(q.prev);s.real={day:q.day};const c=s.cur;c.c=s.p;c.h=Math.max(c.h,s.p);c.l=Math.min(c.l,s.p);ok++;render();save()}
    }catch(e){msg(errText(e));break}
    if(k<list.length-1)await wait(1300);else msg(`${ok}개 종목에 실제 시세를 반영했어요`)}
  busy=false;setBtns(true);showQuota();
}
$('syncAll').addEventListener('click',()=>sync(G.stocks.map((_,i)=>i)));
$('syncOne').addEventListener('click',()=>sync([G.sel]));
(async()=>{try{mcp=window.claude?await claude.use('mcp'):null}catch(e){mcp=null}
  if(!mcp)return;$('syncCard').hidden=false;msg('Alpha Vantage에서 실제 시세를 받아올 수 있어요. 무료 키는 하루 25회예요.');showQuota();setBtns(true)})();

// ---- 로그인 (Firebase) ----
const FIREBASE_CONFIG={apiKey:"AIzaSyAro1qM9-rWiX4L4tYBurnoWO556fqCg44",authDomain:"nasdaq-game.firebaseapp.com",projectId:"nasdaq-game",
  storageBucket:"nasdaq-game.firebasestorage.app",messagingSenderId:"742933572510",appId:"1:742933572510:web:9716a4ae9cda62b03f848f"};
const FBV='10.12.2',DOMAIN='@nasdaq-game.app',KEEPK='nasdaqlive1-keep';
let fb=null,user=null,signup=false,cloudReady=false;
const gate=$('gate');
try{const k=localStorage.getItem(KEEPK);if(k!==null)$('keep').checked=k==='1'}catch(e){}
function gateMode(up){signup=up;$('pw2wrap').hidden=!up;$('pw').autocomplete=up?'new-password':'current-password';
  $('gTitle').innerHTML=up?'사용할 아이디와<br>비밀번호를 정해주세요':'아이디와 비밀번호를<br>입력해주세요';
  $('gogo').textContent=up?'가입하고 시작하기':'로그인';$('swTx').textContent=up?'이미 계정이 있나요?':'처음이신가요?';$('swBtn').textContent=up?'로그인':'회원가입';$('gerr').textContent=''}
$('swBtn').addEventListener('click',()=>gateMode(!signup));
function authErr(c){return({'auth/invalid-credential':'아이디 또는 비밀번호가 맞지 않아요.','auth/wrong-password':'아이디 또는 비밀번호가 맞지 않아요.','auth/user-not-found':'없는 아이디예요. 회원가입을 해주세요.',
  'auth/email-already-in-use':'이미 누가 쓰고 있는 아이디예요.','auth/weak-password':'비밀번호는 6자 이상이어야 해요.','auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 해주세요.',
  'auth/network-request-failed':'인터넷 연결을 확인해 주세요.','auth/operation-not-allowed':'로그인 기능이 아직 켜지지 않았어요.'})[c]||('로그인 중 문제가 생겼어요 ('+c+')')}
$('gform').addEventListener('submit',async e=>{
  e.preventDefault();const id=$('uid').value.trim().toLowerCase(),pw=$('pw').value,keep=$('keep').checked;
  if(!/^[a-z0-9_]{3,20}$/.test(id))return $('gerr').textContent='아이디는 영문 소문자·숫자·밑줄로 3~20자예요.';
  if(pw.length<6)return $('gerr').textContent='비밀번호는 6자 이상이어야 해요.';
  if(signup&&pw!==$('pw2').value)return $('gerr').textContent='비밀번호 확인이 일치하지 않아요.';
  if(!fb)return $('gerr').textContent='로그인 기능을 준비하는 중이에요. 잠시 후 다시 시도해 주세요.';
  try{localStorage.setItem(KEEPK,keep?'1':'0')}catch(e){}
  $('gogo').disabled=true;$('gerr').textContent='';
  try{await fb.a.setPersistence(fb.auth,keep?fb.a.browserLocalPersistence:fb.a.browserSessionPersistence);
    await (signup?fb.a.createUserWithEmailAndPassword:fb.a.signInWithEmailAndPassword)(fb.auth,id+DOMAIN,pw)}
  catch(err){$('gerr').textContent=authErr(err&&err.code)}
  $('gogo').disabled=false;
});
$('guest').addEventListener('click',()=>{gate.classList.remove('show');$('me').textContent='둘러보는 중';$('logout').hidden=false;$('logout').textContent='로그인'});
$('logout').addEventListener('click',async()=>{if(user&&fb){await pushCloud(true);await fb.a.signOut(fb.auth)}else{gateMode(false);gate.classList.add('show')}});
async function pushCloud(force){
  if(!fb||!user||!cloudReady||(!cloudDirty&&!force))return;cloudDirty=false;
  try{await fb.f.setDoc(fb.f.doc(fb.db,'users',user.uid),{state:JSON.stringify(G),updatedAt:fb.f.serverTimestamp()})}catch(e){cloudDirty=true}
}
setInterval(pushCloud,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pushCloud()});
async function onUser(u){
  user=u;cloudReady=false;
  if(!u){UKEY=KEY;if(!load())newGame();listSig='';render();$('me').textContent='';$('logout').hidden=true;gateMode(false);gate.classList.add('show');return}
  gate.classList.remove('show');$('pw').value='';$('pw2').value='';
  $('me').textContent=(u.email||'').replace(DOMAIN,'')+'님';$('logout').hidden=false;$('logout').textContent='로그아웃';
  UKEY=KEY+'-'+u.uid;
  try{const snap=await fb.f.getDoc(fb.f.doc(fb.db,'users',u.uid));let s=null;
    if(snap.exists()){try{s=JSON.parse(snap.data().state)}catch(e){}}
    if(s&&s.stocks&&s.stocks.length===DEF.length){G=s;save()}else if(!load())newGame();
  }catch(e){if(!load())newGame();toast('저장된 잔고를 불러오지 못해 이 기기 저장본으로 시작해요')}
  listSig='';render();cloudReady=true;pushCloud(true);
}
(async()=>{
  gate.classList.add('show');
  try{const base='https://www.gstatic.com/firebasejs/'+FBV+'/';
    const [app,a,f]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const fapp=app.initializeApp(FIREBASE_CONFIG);fb={a,f,auth:a.getAuth(fapp),db:f.getFirestore(fapp)};
    a.onAuthStateChanged(fb.auth,onUser);
  }catch(e){$('gerr').textContent='이 화면에서는 로그인을 쓸 수 없어요. 둘러보기로 플레이해 주세요.'}
})();

if(!load())newGame();else render();
start();
}
</script>
